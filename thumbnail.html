<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 40%, #ecfdf5 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  text-align: center;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 20px;
}
.logo-icon {
  width: 90px;
  height: 90px;
  background: linear-gradient(135deg, #f97316, #ec4899);
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  color: white;
  font-weight: bold;
  box-shadow: 0 8px 24px rgba(249,115,22,0.3);
}
.logo-text {
  font-size: 80px;
  font-weight: 900;
  background: linear-gradient(135deg, #f97316, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  font-size: 36px;
  color: #374151;
  font-weight: 700;
  line-height: 1.3;
}
.tags {
  display: flex;
  gap: 16px;
}
.tag {
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 24px;
  font-weight: 700;
  color: white;
}
.tag-math { background: linear-gradient(135deg, #3b82f6, #6366f1); }
.tag-korean { background: linear-gradient(135deg, #10b981, #059669); }
.tag-english { background: linear-gradient(135deg, #f59e0b, #d97706); }
.tag-game { background: linear-gradient(135deg, #ef4444, #ec4899); }
.badge {
  font-size: 22px;
  color: #6b7280;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo-row">
    <div class="logo-icon">놀</div>
    <div class="logo-text">놀공</div>
  </div>
  <div class="subtitle">놀면서 배우는 어린이 종합 학습앱</div>
  <div class="tags">
    <span class="tag tag-math">🔢 수학</span>
    <span class="tag tag-korean">가 한글</span>
    <span class="tag tag-english">A 영어</span>
    <span class="tag tag-game">🎮 게임</span>
  </div>
  <div class="badge">✨ 무료 · 광고 없음 · 설치 없이 바로 시작</div>
</div>
</body>
</html>
